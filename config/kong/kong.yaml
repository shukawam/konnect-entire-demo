_format_version: '3.0'

upstreams:
  - name: catalog-service.upstream
    targets:
      - target: catalog-service:3001
        weight: 100
    sticky_sessions_cookie_path: /
    # 全 upstream 共通のヘルスチェック設定。以降の upstream は *upstream_healthchecks で参照する。
    healthchecks: &upstream_healthchecks
      active:
        type: http
        http_path: /health
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
      passive:
        type: http
        healthy:
          successes: 2
        unhealthy:
          http_failures: 3
          tcp_failures: 1

  - name: cart-service.upstream
    targets:
      - target: cart-service:3002
        weight: 100
    sticky_sessions_cookie_path: /
    healthchecks: *upstream_healthchecks

  - name: order-service.upstream
    targets:
      - target: order-service:3003
        weight: 100
    sticky_sessions_cookie_path: /
    healthchecks: *upstream_healthchecks

  - name: shipping-service.upstream
    targets:
      - target: shipping-service:3004
        weight: 100
    sticky_sessions_cookie_path: /
    healthchecks: *upstream_healthchecks

  - name: user-service.upstream
    targets:
      - target: user-service:3005
        weight: 100
    sticky_sessions_cookie_path: /
    healthchecks: *upstream_healthchecks

  - name: agent-service.upstream
    targets:
      - target: agent-service:3006
        weight: 100
    sticky_sessions_cookie_path: /
    healthchecks: *upstream_healthchecks

services:
  - name: catalog-service
    host: catalog-service.upstream
    protocol: http
    retries: 3
    connect_timeout: 5000
    read_timeout: 15000
    write_timeout: 10000
    routes:
      - name: catalog-route
        paths:
          - /api/products
        protocols:
          - http
          - https
        strip_path: false
  - name: cart-service
    host: cart-service.upstream
    protocol: http
    retries: 3
    connect_timeout: 5000
    read_timeout: 15000
    write_timeout: 10000
    routes:
      - name: cart-route
        paths:
          - /api/carts
        protocols:
          - http
          - https
        strip_path: false
  - name: order-service
    host: order-service.upstream
    protocol: http
    retries: 0 # POST による注文作成の重複を防ぐためリトライ無効
    connect_timeout: 5000
    read_timeout: 15000
    write_timeout: 10000
    routes:
      - name: order-route
        paths:
          - /api/orders
        protocols:
          - http
          - https
        strip_path: false
  - name: shipping-service
    host: shipping-service.upstream
    protocol: http
    retries: 3
    connect_timeout: 5000
    read_timeout: 15000
    write_timeout: 10000
    routes:
      - name: shipping-route
        paths:
          - /api/shipments
        protocols:
          - http
          - https
        strip_path: false
  - name: user-service
    host: user-service.upstream
    protocol: http
    retries: 3
    connect_timeout: 5000
    read_timeout: 15000
    write_timeout: 10000
    routes:
      - name: user-route
        paths:
          - /api/users
        protocols:
          - http
          - https
        strip_path: false
  - name: agent-service
    host: agent-service.upstream
    protocol: http
    retries: 3
    connect_timeout: 5000
    read_timeout: 60000
    write_timeout: 60000
    routes:
      - name: agent-route
        paths:
          - /api/agent
        protocols:
          - http
          - https
        strip_path: false

  # ============================================================
  # /admin — curl / API クライアント向けの API キー認証経路
  # ブラウザ経路（/api/...）は OIDC のまま。curl は JWT を取得せず apikey ヘッダーで叩ける。
  # 各 admin サービスは host=既存 upstream・path=バックエンドのベースパスを持ち、ルートで
  # `/admin/api/<name>` プレフィックスを strip_path する。例: /admin/api/carts/items を strip し
  # 残り /items に service.path(/api/carts) を前置 → /api/carts/items として転送する。
  # X-User-Id 等は request-transformer で固定値(curl-admin)を注入する（後段プラグイン参照）。
  # ============================================================
  - name: cart-admin-service
    host: cart-service.upstream
    path: /api/carts
    protocol: http
    retries: 3
    connect_timeout: 5000
    read_timeout: 15000
    write_timeout: 10000
    routes:
      - name: cart-admin-route
        paths:
          - /admin/api/carts
        protocols:
          - http
          - https
        strip_path: true
  - name: order-admin-service
    host: order-service.upstream
    path: /api/orders
    protocol: http
    retries: 0
    connect_timeout: 5000
    read_timeout: 15000
    write_timeout: 10000
    routes:
      - name: order-admin-route
        paths:
          - /admin/api/orders
        protocols:
          - http
          - https
        strip_path: true
  - name: shipping-admin-service
    host: shipping-service.upstream
    path: /api/shipments
    protocol: http
    retries: 3
    connect_timeout: 5000
    read_timeout: 15000
    write_timeout: 10000
    routes:
      - name: shipping-admin-route
        paths:
          - /admin/api/shipments
        protocols:
          - http
          - https
        strip_path: true
  - name: user-admin-service
    host: user-service.upstream
    path: /api/users
    protocol: http
    retries: 3
    connect_timeout: 5000
    read_timeout: 15000
    write_timeout: 10000
    routes:
      - name: user-admin-route
        paths:
          - /admin/api/users
        protocols:
          - http
          - https
        strip_path: true

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Content-Type
        - Authorization
        - apikey
        - X-User-Id
        - traceparent
        - tracestate
      credentials: true
      max_age: 3600
  - name: rate-limiting-advanced
    config:
      limit:
        - 60
      window_size:
        - 60
      namespace: jungle-store
      strategy: local # 複数 DP でカウンター共有する場合は redis を使用
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
  - name: opentelemetry
    config:
      traces_endpoint: http://otel-lgtm:4318/v1/traces
      logs_endpoint: http://otel-lgtm:4318/v1/logs
      access_logs_endpoint: http://otel-lgtm:4318/v1/logs
      metrics:
        endpoint: http://otel-lgtm:4318/v1/metrics
        push_interval: 5
        enable_ai_metrics: true
        enable_bandwidth_metrics: true
        enable_consumer_attribute: true
        enable_latency_metrics: true
        enable_request_metrics: true
        enable_upstream_health_metrics: true
      resource_attributes:
        service.name: kong-gateway
      propagation:
        default_format: w3c
        extract:
          - w3c
        inject:
          - w3c
  - name: prometheus
    config:
      ai_metrics: true

  # OpenID Connect — Keycloak のアクセストークン(JWT)を検証してエンドユーザーを認証する。
  # NextAuth(Auth.js) が取得した access_token を Authorization: Bearer で受け取り、
  # 署名/有効期限/iss を検証したうえで claim を upstream ヘッダーへ注入する:
  #   sub → X-User-Id, email → X-User-Email, preferred_username → X-User-Name
  # 各バックエンドは従来どおり X-User-Id でユーザーを識別する。
  # 5 サービス共通の OIDC 設定。以降のサービスは *oidc_config で参照する。
  - name: openid-connect
    service: cart-service
    config: &oidc_config
      issuer: ${{ env "DECK_KEYCLOAK_ISSUER" }}
      auth_methods:
        - bearer
      cache_tokens_salt: jungle-store-oidc
      upstream_headers_claims:
        - sub
        - email
        - preferred_username
      upstream_headers_names:
        - X-User-Id
        - X-User-Email
        - X-User-Name

  # OpenID Connect on Order
  - name: openid-connect
    service: order-service
    config: *oidc_config

  # OpenID Connect on Shipping
  - name: openid-connect
    service: shipping-service
    config: *oidc_config

  # OpenID Connect on User（/api/users/me は本人のトークンが必須）
  - name: openid-connect
    service: user-service
    config: *oidc_config

  # OpenID Connect on Agent（AI チャットはログイン必須。/api/agent/* を保護）
  - name: openid-connect
    service: agent-service
    config: *oidc_config

  # Stricter Rate Limiting on Order
  - name: rate-limiting
    service: order-service
    config:
      minute: 10
      policy: local

  # Proxy Cache on Catalog
  - name: proxy-cache
    service: catalog-service
    config:
      response_code:
        - 200
      request_method:
        - GET
      content_type:
        - application/json
      cache_ttl: 30
      strategy: memory

  # ============================================================
  # /admin 経路の認証: key-auth(apikey ヘッダー) + X-User-Id 注入
  # ブラウザ経路(OIDC)は変更なし。admin サービスにのみ適用する。
  # ============================================================
  - name: key-auth
    service: cart-admin-service
    config:
      key_names:
        - apikey
      hide_credentials: true
  - name: key-auth
    service: order-admin-service
    config:
      key_names:
        - apikey
      hide_credentials: true
  - name: key-auth
    service: shipping-admin-service
    config:
      key_names:
        - apikey
      hide_credentials: true
  - name: key-auth
    service: user-admin-service
    config:
      key_names:
        - apikey
      hide_credentials: true

  # JWT が無いので X-User-Id 等を固定のデモ識別子で注入する。
  # クライアントが詐称ヘッダーを送っても remove → add で確実に上書きする。
  - name: request-transformer
    service: cart-admin-service
    config:
      remove:
        headers:
          - X-User-Id
          - X-User-Email
          - X-User-Name
      add:
        headers:
          - 'X-User-Id:curl-admin'
          - 'X-User-Email:curl-admin@example.com'
          - 'X-User-Name:curl-admin'
  - name: request-transformer
    service: order-admin-service
    config:
      remove:
        headers:
          - X-User-Id
          - X-User-Email
          - X-User-Name
      add:
        headers:
          - 'X-User-Id:curl-admin'
          - 'X-User-Email:curl-admin@example.com'
          - 'X-User-Name:curl-admin'
  - name: request-transformer
    service: shipping-admin-service
    config:
      remove:
        headers:
          - X-User-Id
          - X-User-Email
          - X-User-Name
      add:
        headers:
          - 'X-User-Id:curl-admin'
          - 'X-User-Email:curl-admin@example.com'
          - 'X-User-Name:curl-admin'
  - name: request-transformer
    service: user-admin-service
    config:
      remove:
        headers:
          - X-User-Id
          - X-User-Email
          - X-User-Name
      add:
        headers:
          - 'X-User-Id:curl-admin'
          - 'X-User-Email:curl-admin@example.com'
          - 'X-User-Name:curl-admin'

# /admin 経路を利用する API キーの所有者。apikey: jungle-store-demo-admin-key で認証する。
consumers:
  - username: curl-admin
    keyauth_credentials:
      - key: jungle-store-demo-admin-key
