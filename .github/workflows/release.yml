name: Release

on:
  release:
    types: [published]

jobs:
  build-push:
    name: Build & Push (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: catalog-service
            dockerfile: services/catalog-service/Dockerfile
          - name: cart-service
            dockerfile: services/cart-service/Dockerfile
          - name: order-service
            dockerfile: services/order-service/Dockerfile
          - name: shipping-service
            dockerfile: services/shipping-service/Dockerfile
          - name: user-service
            dockerfile: services/user-service/Dockerfile
          - name: agent-service
            dockerfile: services/agent-service/Dockerfile
          - name: recommendation-agent-service
            dockerfile: services/recommendation-agent-service/Dockerfile
          - name: order-agent-service
            dockerfile: services/order-agent-service/Dockerfile
          - name: frontend
            dockerfile: services/frontend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/shukawam/konnect-entire-demo-${{ matrix.name }}:${{ github.event.release.tag_name }}
