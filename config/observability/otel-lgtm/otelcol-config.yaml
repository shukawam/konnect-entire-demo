# otel-lgtm の内蔵 OpenTelemetry Collector 設定を上書きする。
# デフォルト設定をベースに、span 単位で落とす filter/traces、トレース単位で丸ごと
# 落とす tail_sampling、Kong AI メトリクス用の Prometheus スクレイプ (kong:8100) を追加している。
# exporter は otel-lgtm コンテナ内部のバックエンド (localhost) を指す。
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: 'opentelemetry-collector'
          scrape_interval: 1s
          static_configs:
            - targets: ['127.0.0.1:8888']
        - job_name: kong-gateway # Kong Status API
          scrape_interval: 5s
          static_configs:
            - targets:
                - kong:8100
        - job_name: kong-ai-gateway # Kong Status API（AI メトリクス取得用）
          scrape_interval: 5s
          static_configs:
            - targets:
                - kong-ai:8100

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: '/ready'

processors:
  batch:
  filter/traces:
    error_mode: ignore
    traces:
      span:
        - 'name == "prisma:client:load_engine"'
        - 'name == "prisma:client:detect_platform"'
        - 'attributes["url.path"] == "/health"'
        - 'attributes["http.target"] == "/health"'
        - 'attributes["http.target"] == "/api/health"'
        - 'attributes["url.path"] == "/api/health"'
        - 'IsMatch(name, ".* /api/health$")'
        - 'attributes["next.route"] == "/api/health"'
        - 'IsMatch(name, ".*/api/health/route$")'
        - 'name == "start response"' # unscoped: NextNodeServer.startResponse span carries no route attribute to filter on (OTTL filter processor has no cross-span/sibling context to join against the parent request's route); this also drops this one span from any real-user traces that happen to include it (route handlers only — verified absent from full-page SSR `GET /` renders) — accepted since the span itself carries no attributes of debugging value
        # Event Gateway (KEG) の Kafka プロトコルポーリング / 自身のコントロールプレーン
        # ポーリング span。実測（10分アイドル計測）で確認済みのノイズで、注文→発送の
        # 連結トレース（kong-gateway/order-service/shipping-service）には一切現れない。
        # `attributes["api_kind"]` はこの KEG バージョンには存在しないため属性フィルタは
        # 機能せず（旧8行は死んだフィルタだった）、span 名で family 単位（root + 子span全て）
        # を丸ごと落とす方式に変更した（子 span だけ orphan で残さないため）。
        - 'name == "request"' # KEG root span（Kafka fetch/heartbeat ポーリング）
        - 'name == "backend_request"' # request の子 span
        - 'name == "transform_request"' # request の子 span
        - 'name == "transform_response"' # request の子 span
        - 'name == "write_to_client"' # request の子 span
        - 'name == "authenticator_handle"' # request の子 span
        - 'name == "fetch_latest_dataplane_config"' # KEG 自身の Konnect コントロールプレーンポーリング
        - 'name == "call"' # api_versions/update_metadata の親 span（Kafka クライアントの RPC 呼び出し）
        - 'name == "client_connection"'
        - 'name == "api_versions"' # call の子 span（Kafka API バージョンネゴシエーション）
        - 'name == "update_metadata"' # call の子 span（Kafka ブローカーメタデータの定期更新。kong.keg.metadata_update.refresh_reason=on_interval/forced_refresh で確認済み）
  # AI Gateway の MCP エンドポイント (/mcp/products, /mcp/carts, /mcp/orders) への GET ポーリングを
  # トレース単位で除去する。MCP Streamable HTTP クライアント(SDK)がサーバー push 用の SSE ストリームを
  # GET で開こうとするが、ai-mcp-proxy 側がストリームを保持せず即クローズするため、SDK が「正常切断」と
  # みなして 1 秒間隔で無限に再接続を試み続ける（実測: kong-ai-gateway 3ルート合計で idle 時も約3.4
  # trace/秒。実ツール呼び出しは POST のため対象外）。route/method を持つのは root の "kong" span のみで
  # 子 span（kong.router / kong.access.plugin.* 等）は全リクエスト共通の汎用名のため span 単位の
  # filter/traces では絞れず、root だけ落としても子が孤児 span として残り Tempo 上の件数は減らない
  # （実測確認済み）。そのため tail_sampling でトレース全体を drop する。副作用として全トレースに
  # decision_wait 分の遅延が入る（LLM チャット系の最長トレース(実測 7s 程度)を切り詰めないよう 10s に設定）。
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    policies:
      - name: drop-ai-gateway-mcp-get-polling
        type: drop
        drop:
          drop_sub_policy:
            # drop_sub_policy は leaf な shared policy type のみ（and/composite/drop はネスト不可）のため、
            # method と route の AND 条件は ottl_condition の単一式でまとめる。
            - name: mcp-get-polling
              type: ottl_condition
              ottl_condition:
                error_mode: ignore
                span:
                  - 'attributes["http.method"] == "GET" and IsMatch(attributes["http.route"], "^/mcp/")'
      - name: keep-everything-else
        type: always_sample

exporters:
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
  otlp_grpc/profiles:
    endpoint: http://127.0.0.1:4040
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, filter/traces, batch]
      exporters: [otlp_http/traces]
    metrics:
      receivers: [otlp, prometheus/collector]
      processors: [batch]
      exporters: [otlp_http/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/logs]
    profiles:
      receivers: [otlp]
      exporters: [otlp_grpc/profiles]
